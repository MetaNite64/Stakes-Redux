[manifest]
version = "1.0.0"
priority = 0

# modify interest rate
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
match_indent = true
position = "at"
pattern = "if G.GAME.dollars >= 5 and not G.GAME.modifiers.no_interest then"
payload = '''
local interest_rate = 5 + (G.GAME.modifiers.srdx_interest_mod or 0)
local interest = G.GAME.interest_amount * math.min(math.floor(G.GAME.dollars / interest_rate), G.GAME.interest_cap / interest_rate)
if G.GAME.dollars >= interest_rate and not G.GAME.modifiers.no_interest then
'''
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
match_indent = true
position = "at"
pattern = "add_round_eval_row({bonus = true, name='interest', pitch = pitch, dollars = G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)})"
payload = "add_round_eval_row({bonus = true, name = 'interest', pitch = pitch, dollars = interest})"
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
match_indent = true
position = "at"
pattern = '''
if G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5) == G.GAME.interest_amount*G.GAME.interest_cap/5 then
'''
payload = "if interest == G.GAME.interest_amount * G.GAME.interest_cap / interest_rate then"
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
match_indent = true
position = "at"
pattern = "dollars = dollars + G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)"
payload = "dollars = dollars + interest"

# display the modified interest rate
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
match_indent = true
position = "at"
pattern = '''
table.insert(left_text,{n=G.UIT.O, config={object = DynaText({string = {" "..localize{type = 'variable', key = 'interest', vars = {G.GAME.interest_amount, 5, G.GAME.interest_amount*G.GAME.interest_cap/5}}}, colours = {G.C.UI.TEXT_LIGHT}, shadow = true, pop_in = 0, scale = 0.4*scale, silent = true})}})
'''
payload = '''
local interest_rate = 5 + (G.GAME.modifiers.srdx_interest_mod or 0)
local interest_max = G.GAME.interest_amount * G.GAME.interest_cap / interest_rate
table.insert(left_text,{n=G.UIT.O, config={object = DynaText({string = {" "..localize{type = 'variable', key = 'interest', vars = {G.GAME.interest_amount, interest_rate, interest_max}}}, colours = {G.C.UI.TEXT_LIGHT}, shadow = true, pop_in = 0, scale = 0.4*scale, silent = true})}})
'''